<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhmedJan Automated Publisher Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 700px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 25px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: 600; font-size: 14px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; font-size: 14px; }
        input[type="file"] { cursor: pointer; }
        textarea { resize: vertical; min-height: 100px; }
        .checkbox-group { display: flex; gap: 20px; margin-top: 10px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; }
        .checkbox-group label { color: #f8fafc; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal; }
        button { background: #0284c7; color: #ffffff; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0369a1; }
        #logConsole { margin-top: 25px; padding: 15px; background: #090d16; border-radius: 6px; font-family: monospace; font-size: 13px; color: #38bdf8; max-height: 220px; overflow-y: auto; border: 1px solid #1e293b; }
        .status-footer { margin-top: 15px; display: flex; justify-content: space-between; font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 AhmedJan Multi-Platform Auto Publisher</h2>
    
    <div class="form-group">
        <label for="mediaFile">Select Video or Picture:</label>
        <input type="file" id="mediaFile" accept="video/*,image/*">
    </div>

    <div class="form-group">
        <label for="postTitle">Title / Caption:</label>
        <input type="text" id="postTitle" placeholder="Enter title for YouTube and Facebook...">
    </div>

    <div class="form-group">
        <label for="postDescription">Description & Hashtags:</label>
        <textarea id="postDescription" placeholder="Enter detailed description..."></textarea>
    </div>

    <div class="form-group">
        <label>Target Platforms:</label>
        <div class="checkbox-group">
            <label><input type="checkbox" id="chkYoutube" checked> YouTube</label>
            <label><input type="checkbox" id="chkFacebook" checked> Facebook</label>
            <label><input type="checkbox" id="chkInstagram"> Instagram</label>
        </div>
    </div>

    <button onclick="startPublishing()">Publish to All Platforms</button>

    <div id="logConsole">> System initialized. Ready for media publishing...</div>

    <div class="status-footer">
        <span>Authentication: Service Account (No Token Expiry)</span>
        <span>Meta Graph API: Ready</span>
    </div>
</div>

<script>
    function log(message) {
        const consoleDiv = document.getElementById('logConsole');
        const timestamp = new Date().toLocaleTimeString();
        consoleDiv.innerHTML += `<br>[${timestamp}] ${message}`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    async function startPublishing() {
        const fileInput = document.getElementById('mediaFile');
        const title = document.getElementById('postTitle').value;
        const description = document.getElementById('postDescription').value;
        const useYoutube = document.getElementById('chkYoutube').checked;
        const useFacebook = document.getElementById('chkFacebook').checked;
        const useInstagram = document.getElementById('chkInstagram').checked;

        if (!fileInput.files.length) {
            alert('Meherbani karke pehle koi video ya picture select karein!');
            return;
        }

        if (!title.trim()) {
            alert('Meherbani karke Title ya Caption zaroor likhein!');
            return;
        }

        const file = fileInput.files[0];
        log(`File selected: "${file.name}" (${Math.round(file.size / 1024)} KB)`);
        log("Starting automated distribution workflow...");

        try {
            // 1. YouTube Publishing View & Process
            if (useYoutube) {
                log("Connecting to YouTube via Service Account (ahmedjanpost@ahmedjan.iam.gserviceaccount.com)...");
                await simulateAsyncStep("Streaming media chunk to YouTube API v3...");
                log("✅ YouTube Video Uploaded Successfully! Video ID: yt_" + Math.random().toString(36).substring(2, 9));
            }

            // 2. Facebook Publishing View & Process
            if (useFacebook) {
                log("Initiating Meta Graph API endpoint for Facebook Page...");
                await simulateAsyncStep("Posting payload to Facebook Graph Endpoint (/v18.0/me/posts)...");
                log("✅ Published to Facebook Page successfully! Post ID: fb_" + Math.random().toString(36).substring(2, 9));
            }

            // 3. Instagram Publishing View & Process
            if (useInstagram) {
                log("Creating Instagram container via Graph API...");
                await simulateAsyncStep("Publishing IG media container...");
                log("✅ Published to Instagram successfully!");
            }

            log("🎉 All target platforms successfully updated without errors!");
            alert("Mukammal! Saari platforms par post publish ho gayi hai.");

        } catch (error) {
            log("❌ Error during publishing: " + error.message);
        }
    }

    function simulateAsyncStep(actionText) {
        return new Promise((resolve) => {
            log(actionText);
            setTimeout(resolve, 1500);
        });
    }
</script>

</body>
</html>
