<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhmedJan Direct YouTube Publisher</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent-color: #38bdf8;
            --btn-success: linear-gradient(135deg, #10b981, #059669);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .dashboard-card {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 {
            font-size: 24px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
        input[type="text"], textarea, input[type="file"] {
            width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color); color: var(--text-main);
            border-radius: 10px; font-size: 14px; outline: none;
        }
        .btn-submit {
            background: var(--btn-success); color: white; border: none;
            padding: 15px; width: 100%; font-weight: 700; border-radius: 12px;
            cursor: pointer; font-size: 16px; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .console-box {
            margin-top: 20px; padding: 15px; background: #050811;
            border-radius: 10px; font-family: monospace; font-size: 12px;
            color: #38bdf8; max-height: 180px; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header">
        <h1><i class="fa-solid fa-cloud-arrow-up"></i> AhmedJan YouTube Publisher</h1>
        <p style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Direct Browser-to-YouTube Upload Engine</p>
    </div>

    <div class="form-group">
        <label for="accessToken"><i class="fa-solid fa-key"></i> OAuth2 Access Token / Bearer Token:</label>
        <input type="text" id="accessToken" placeholder="Paste active Google OAuth token here...">
    </div>

    <div class="form-group">
        <label for="mediaFile"><i class="fa-solid fa-video"></i> Select Video File:</label>
        <input type="file" id="mediaFile" accept="video/*">
    </div>

    <div class="form-group">
        <label for="postTitle"><i class="fa-solid fa-heading"></i> Video Title:</label>
        <input type="text" id="postTitle" placeholder="Enter video title...">
    </div>

    <div class="form-group">
        <label for="postDescription"><i class="fa-solid fa-align-left"></i> Description:</label>
        <textarea id="postDescription" rows="3" placeholder="Enter video description..."></textarea>
    </div>

    <button class="btn-submit" id="uploadBtn" onclick="uploadDirectToYouTube()">
        <i class="fa-solid fa-paper-plane"></i> Start Direct YouTube Upload
    </button>

    <div class="console-box" id="logConsole">
        > System ready. Connect token and select media...
    </div>
</div>

<script>
    function writeLog(msg, isError = false) {
        const consoleDiv = document.getElementById('logConsole');
        const time = new Date().toLocaleTimeString();
        const colorStyle = isError ? 'color: #ef4444;' : 'color: #38bdf8;';
        consoleDiv.innerHTML += `<br><span style="${colorStyle}">[${time}] ${msg}</span>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    async function uploadDirectToYouTube() {
        const token = document.getElementById('accessToken').value.trim();
        const fileInput = document.getElementById('mediaFile');
        const title = document.getElementById('postTitle').value.trim();
        const description = document.getElementById('postDescription').value.trim();

        if (!token) {
            alert('OAuth Access Token paste karna zaroori hai!');
            return;
        }
        if (!fileInput.files.length || !title) {
            alert('Video file aur Title select karein!');
            return;
        }

        const file = fileInput.files[0];
        writeLog(`Preparing file: ${file.name} (${Math.round(file.size/1024/1024)} MB)`);
        writeLog("Initiating Resumable Upload Session with Google APIs...");

        const metadata = {
            snippet: { title: title, description: description, categoryId: '22' },
            status: { privacyStatus: 'public' }
        };

        try {
            // Step 1: Initialize Resumable Session
            const res = await fetch('https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'X-Upload-Content-Length': file.size,
                    'X-Upload-Content-Type': file.type
                },
                body: JSON.stringify(metadata)
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.error ? errData.error.message : 'Session initialization failed');
            }

            const uploadUrl = res.headers.get('Location');
            writeLog("Upload session created. Streaming binary data to YouTube...");

            // Step 2: Upload File Binary
            const uploadRes = await fetch(uploadUrl, {
                method: 'PUT',
                headers: { 'Content-Type': file.type },
                body: file
            });

            const uploadResult = await uploadRes.json();
            if (uploadRes.ok) {
                writeLog(`✅ SUCCESS! Video published to YouTube Channel! Video ID: ${uploadResult.id}`);
                alert("Mubarak ho! Video direct YouTube par upload ho gayi hai.");
            } else {
                throw new Error(uploadResult.error ? uploadResult.error.message : 'Video upload failed');
            }
        } catch (err) {
            writeLog(`❌ UPLOAD ERROR: ${err.message}`, true);
            alert("Upload Error: " + err.message);
        }
    }
</script>

</body>
</html>
